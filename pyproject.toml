[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medic-clinical-compiler"
version = "0.2.0"
description = "Local agent-first ankle medical decision support with evidence-grounded multi-model deliberation"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.13,<3",
  "openai>=2,<3",
  "anthropic>=1,<2",
  "google-genai>=1,<2",
  "PyMuPDF>=1.26,<2",
  "httpx>=0.28,<1",
  "Markdown>=3.8,<4",
  "Pillow>=10,<13",
  "numpy>=2,<3",
  "pydicom>=3,<4",
  "pycdlib>=1.14,<2",
  "pynrrd>=1,<2",
  "defusedxml>=0.7.1,<0.8",
]

[project.scripts]
medic = "medic.cli:main"

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[tool.setuptools]
packages = ["medic"]
